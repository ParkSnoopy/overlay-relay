name: Container

on:
  push:
    branches: [main]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/parksnoopy/overlay-relay

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout@v4 - Check Out
        uses: actions/checkout@v4

      - name: bash - Read Version from server/Cargo.toml
        id: version
        run: |
          version=$(awk '/^\[/{section=$0} section=="[package]" && /^version[[:space:]]*=/{gsub(/"/, "", $3); print $3; exit}' server/Cargo.toml)
          if [ "$version" = "" ]; then
            echo "version not found in server/Cargo.toml" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: docker/login-action@v3 - Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: bash - Check Whether the Tag Is Already Published
        id: existing
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${TAG} is already published; skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: docker/setup-buildx-action@v3 - Set Up Docker Buildx
        if: steps.existing.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: docker/build-push-action@v6 - Build and Push the Server Image
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
